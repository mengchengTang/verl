# docker-compose.yaml

services:
  prometheus:
    image: prom/prometheus:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"     # allow a direct connection from container to the local machine
    ports:
      - "9090:9090"   # the default port used by Prometheus
    volumes:
      - /tmp/ray:/tmp/ray:ro
    command:
      - "--config.file=/tmp/ray/session_latest/metrics/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"

  tempo:
    image: grafana/tempo:2.10.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"   # Tempo query API for Grafana datasource
      - "4318:4318"   # OTLP/HTTP trace ingest for MonitorHubActor

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
      - tempo
    ports:
      - "3000:3000"
    volumes:
      - /tmp/ray:/tmp/ray:ro
    command: >
      grafana-server
      --config /tmp/ray/session_latest/metrics/grafana/grafana.ini
      --homepath /usr/share/grafana
      web
