<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Trainer V1 sync resource timeline</title>
  <desc id="desc">Four rollout replicas finish at different times. Faster devices wait for the slowest replica before all shared devices switch to training.</desc>
  <defs>
    <style>
      .title{font:700 26px Arial,sans-serif;fill:#172033}.sub{font:15px Arial,sans-serif;fill:#566176}.label{font:600 16px Arial,sans-serif;fill:#263248}.block{font:600 15px Arial,sans-serif;fill:#fff}.axis{font:13px Arial,sans-serif;fill:#667085}.note{font:14px Arial,sans-serif;fill:#475467}
    </style>
  </defs>
  <rect width="1200" height="440" fill="#f7f9fc"/>
  <text x="48" y="48" class="title">Sync</text>
  <line x1="190" y1="105" x2="1140" y2="105" stroke="#c8d0dd" stroke-width="2"/>
  <text x="190" y="96" class="axis">time</text>
  <path d="M1128 98 L1140 105 L1128 112" fill="none" stroke="#c8d0dd" stroke-width="2"/>
  <g>
    <text x="48" y="151" class="label">device 0</text><text x="48" y="211" class="label">device 1</text><text x="48" y="271" class="label">device 2</text><text x="48" y="331" class="label">device 3</text>
    <g fill="#247ba0"><rect x="190" y="122" width="235" height="40" rx="5"/><rect x="190" y="182" width="310" height="40" rx="5"/><rect x="190" y="242" width="185" height="40" rx="5"/><rect x="190" y="302" width="270" height="40" rx="5"/></g>
    <g fill="#d8dee8"><rect x="425" y="122" width="75" height="40" rx="5"/><rect x="375" y="242" width="125" height="40" rx="5"/><rect x="460" y="302" width="40" height="40" rx="5"/></g>
    <g fill="#e76f51"><rect x="525" y="122" width="430" height="40" rx="5"/><rect x="525" y="182" width="430" height="40" rx="5"/><rect x="525" y="242" width="430" height="40" rx="5"/><rect x="525" y="302" width="430" height="40" rx="5"/></g>
    <g fill="#e9a23b"><rect x="980" y="122" width="160" height="40" rx="5"/><rect x="980" y="182" width="160" height="40" rx="5"/><rect x="980" y="242" width="160" height="40" rx="5"/><rect x="980" y="302" width="160" height="40" rx="5"/></g>
    <g class="block" text-anchor="middle">
      <text x="307" y="148">replica 0 · rollout</text><text x="740" y="148">Train</text><text x="1060" y="148">Sync weights</text>
      <text x="345" y="208">replica 1 · rollout</text><text x="740" y="208">Train</text><text x="1060" y="208">Sync weights</text>
      <text x="282" y="268">replica 2 · rollout</text><text x="740" y="268">Train</text><text x="1060" y="268">Sync weights</text>
      <text x="325" y="328">replica 3 · rollout</text><text x="740" y="328">Train</text><text x="1060" y="328">Sync weights</text>
    </g>
    <g class="note" text-anchor="middle"><text x="462" y="148">Wait</text><text x="437" y="268">Wait</text><text x="480" y="328">Wait</text></g>
    <line x1="500" y1="116" x2="500" y2="350" stroke="#98a2b3" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="500" y="368" text-anchor="middle" class="note">slowest replica completes</text>
  </g>
  <g transform="translate(190 400)"><rect width="18" height="18" rx="3" fill="#247ba0"/><text x="28" y="14" class="note">Rollout</text><rect x="130" width="18" height="18" rx="3" fill="#d8dee8"/><text x="158" y="14" class="note">Long-tail wait</text><rect x="300" width="18" height="18" rx="3" fill="#e76f51"/><text x="328" y="14" class="note">Train</text><rect x="430" width="18" height="18" rx="3" fill="#e9a23b"/><text x="458" y="14" class="note">Weight sync</text></g>
</svg>
