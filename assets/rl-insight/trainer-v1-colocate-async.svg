<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Trainer V1 colocate async resource timeline</title>
  <desc id="desc">Short requests are immediately backfilled with new work. Once enough samples finish, long partial requests are saved and training starts without waiting for the slowest request.</desc>
  <defs><style>.title{font:700 26px Arial,sans-serif;fill:#172033}.sub{font:15px Arial,sans-serif;fill:#566176}.label{font:600 16px Arial,sans-serif;fill:#263248}.block{font:600 14px Arial,sans-serif;fill:#fff}.axis{font:13px Arial,sans-serif;fill:#667085}.note{font:14px Arial,sans-serif;fill:#475467}</style></defs>
  <rect width="1200" height="440" fill="#f7f9fc"/>
  <text x="48" y="48" class="title">Colocate Async</text>
  <line x1="190" y1="105" x2="1140" y2="105" stroke="#c8d0dd" stroke-width="2"/><text x="190" y="96" class="axis">time</text><path d="M1128 98 L1140 105 L1128 112" fill="none" stroke="#c8d0dd" stroke-width="2"/>
  <g>
    <text x="48" y="151" class="label">device 0</text><text x="48" y="211" class="label">device 1</text><text x="48" y="271" class="label">device 2</text><text x="48" y="331" class="label">device 3</text>
    <g fill="#247ba0">
      <rect x="190" y="122" width="120" height="40" rx="5"/><rect x="190" y="182" width="270" height="40" rx="5"/>
      <rect x="190" y="242" width="160" height="40" rx="5"/><rect x="190" y="302" width="270" height="40" rx="5"/>
    </g>
    <g fill="#3a9dc2"><rect x="320" y="122" width="140" height="40" rx="5"/><rect x="360" y="242" width="100" height="40" rx="5"/></g>
    <g fill="#e76f51"><rect x="500" y="122" width="330" height="40" rx="5"/><rect x="500" y="182" width="330" height="40" rx="5"/><rect x="500" y="242" width="330" height="40" rx="5"/><rect x="500" y="302" width="330" height="40" rx="5"/></g>
    <g fill="#e9a23b"><rect x="850" y="122" width="110" height="40" rx="5"/><rect x="850" y="182" width="110" height="40" rx="5"/><rect x="850" y="242" width="110" height="40" rx="5"/><rect x="850" y="302" width="110" height="40" rx="5"/></g>
    <g fill="#2a9d8f"><rect x="980" y="122" width="160" height="40" rx="5"/><rect x="980" y="182" width="160" height="40" rx="5"/><rect x="980" y="242" width="160" height="40" rx="5"/><rect x="980" y="302" width="160" height="40" rx="5"/></g>
    <g class="block" text-anchor="middle">
      <text x="250" y="147">short · done</text><text x="390" y="147">next request</text><text x="665" y="147">Train</text><text x="905" y="147">Sync</text><text x="1060" y="147">Resume rollout</text>
      <text x="325" y="207">long request · save partial</text><text x="665" y="207">Train</text><text x="905" y="207">Sync</text><text x="1060" y="207">Resume rollout</text>
      <text x="270" y="267">short · done</text><text x="410" y="267">next</text><text x="665" y="267">Train</text><text x="905" y="267">Sync</text><text x="1060" y="267">Resume rollout</text>
      <text x="325" y="327">long request · save partial</text><text x="665" y="327">Train</text><text x="905" y="327">Sync</text><text x="1060" y="327">Resume rollout</text>
    </g>
    <line x1="470" y1="116" x2="470" y2="350" stroke="#a855f7" stroke-width="3" stroke-dasharray="7 6"/><text x="470" y="368" text-anchor="middle" class="note">enough samples · save partial</text>
  </g>
  <g transform="translate(190 400)"><rect width="18" height="18" rx="3" fill="#247ba0"/><text x="28" y="14" class="note">Current request</text><rect x="165" width="18" height="18" rx="3" fill="#3a9dc2"/><text x="193" y="14" class="note">Backfilled request</text><rect x="355" width="18" height="18" rx="3" fill="#e76f51"/><text x="383" y="14" class="note">Training</text><rect x="485" width="18" height="18" rx="3" fill="#2a9d8f"/><text x="513" y="14" class="note">Resumed partial rollout</text></g>
</svg>
