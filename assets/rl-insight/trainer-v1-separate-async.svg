<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Trainer V1 separate async resource timeline</title>
  <desc id="desc">Standalone rollout devices generate continuously while trainer devices update the model and can become hybrid rollout replicas when idle.</desc>
  <defs><style>.title{font:700 26px Arial,sans-serif;fill:#172033}.sub{font:15px Arial,sans-serif;fill:#566176}.group{font:700 14px Arial,sans-serif;fill:#344054}.label{font:600 16px Arial,sans-serif;fill:#263248}.block{font:600 14px Arial,sans-serif;fill:#fff}.axis{font:13px Arial,sans-serif;fill:#667085}.note{font:14px Arial,sans-serif;fill:#475467}</style></defs>
  <rect width="1200" height="520" fill="#f7f9fc"/>
  <text x="48" y="48" class="title">Separate Async</text>
  <line x1="220" y1="105" x2="1140" y2="105" stroke="#c8d0dd" stroke-width="2"/><text x="220" y="96" class="axis">time</text><path d="M1128 98 L1140 105 L1128 112" fill="none" stroke="#c8d0dd" stroke-width="2"/>
  <rect x="32" y="116" width="1128" height="145" rx="8" fill="#eef7fa" stroke="#9bc5d4"/><text x="48" y="141" class="group">STANDALONE ROLLOUT POOL</text>
  <text x="48" y="187" class="label">device 0</text><text x="48" y="237" class="label">device 1</text>
  <rect x="220" y="158" width="920" height="40" rx="5" fill="#247ba0"/><rect x="220" y="208" width="920" height="40" rx="5" fill="#247ba0"/>
  <g class="block" text-anchor="middle"><text x="680" y="183">Standalone rollout replica · continuous generation</text><text x="680" y="233">Standalone rollout replica · continuous generation</text></g>
  <rect x="32" y="280" width="1128" height="145" rx="8" fill="#fff4ef" stroke="#efb19f"/><text x="48" y="305" class="group">TRAINER / HYBRID POOL</text>
  <text x="48" y="351" class="label">device 2</text><text x="48" y="401" class="label">device 3</text>
  <g fill="#e76f51"><rect x="220" y="322" width="500" height="40" rx="5"/><rect x="220" y="372" width="500" height="40" rx="5"/></g>
  <g fill="#2a9d8f"><rect x="750" y="322" width="390" height="40" rx="5"/><rect x="750" y="372" width="390" height="40" rx="5"/></g>
  <g class="block" text-anchor="middle">
    <text x="470" y="347">Trainer · model update</text><text x="945" y="347">Hybrid rollout replica · trainer idle</text>
    <text x="470" y="397">Trainer · model update</text><text x="945" y="397">Hybrid rollout replica · trainer idle</text>
  </g>
  <path d="M700 322 L700 248" fill="none" stroke="#e9a23b" stroke-width="3" stroke-dasharray="7 5"/><path d="M693 258 L700 248 L707 258" fill="none" stroke="#e9a23b" stroke-width="3"/>
  <rect x="615" y="263" width="170" height="26" rx="13" fill="#fff" stroke="#e9a23b"/><text x="700" y="281" text-anchor="middle" class="note">periodic weight sync</text>
  <g transform="translate(220 460)"><rect width="18" height="18" rx="3" fill="#247ba0"/><text x="28" y="14" class="note">Standalone rollout</text><rect x="190" width="18" height="18" rx="3" fill="#e76f51"/><text x="218" y="14" class="note">Trainer</text><rect x="320" width="18" height="18" rx="3" fill="#2a9d8f"/><text x="348" y="14" class="note">Hybrid rollout when trainer is idle</text><rect x="650" width="18" height="18" rx="3" fill="#e9a23b"/><text x="678" y="14" class="note">Weight sync</text></g>
</svg>
